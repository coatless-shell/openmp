name: OpenMP correctness

on:
  push:
    branches: [main]
    paths:
      - install-openmp.sh
      - test-openmp.sh
      - .github/workflows/test-openmp.yml
  pull_request:
    branches: [main]
    paths:
      - install-openmp.sh
      - test-openmp.sh
      - .github/workflows/test-openmp.yml
  workflow_dispatch:

jobs:
  openmp-correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenMP runtime
        run: ./install-openmp.sh --yes

      - uses: r-lib/actions/setup-r@v2

      - name: Run OpenMP correctness test
        run: ./test-openmp.sh
